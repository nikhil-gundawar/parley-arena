[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parley-ai"
version = "0.1.0"
description = "Multiplayer sessions for AI agents — several humans, one agent, one shared timeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nikhil" }]
keywords = ["ai", "agents", "multiplayer", "collaboration", "llm", "human-in-the-loop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "httpx>=0.26",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
parley = "parley.cli:main"

[project.urls]
Homepage = "https://github.com/nikhil-gundawar/parley-arena"
Issues = "https://github.com/nikhil-gundawar/parley-arena/issues"

[tool.hatch.build.targets.wheel]
packages = ["parley", "web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 118
